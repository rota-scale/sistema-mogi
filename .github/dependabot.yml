# Atualização das dependências (decisão 5 do "MVP que evolui"): toda semana o
# GitHub abre PRs agrupados; o CI roda os testes antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups: { go: { patterns: ["*"] } }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /painel
    schedule: { interval: weekly, day: monday }
    groups: { painel: { patterns: ["*"] } }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday }
    groups: { app: { patterns: ["*"] } }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
